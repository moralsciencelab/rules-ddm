  <script>

    /* initialize jsPsych */
    var jsPsych = initJsPsych({
    experiment_width: 1000});

    var timeline = [];

    //*block placeholders*/
    // Define your block objects here with the correct plugin type as strings
    var cars_80 = {
        name: 'cars_80', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the cars_80 block.<br>Press any key to continue.</p>'
    };

    var cars_20 = {
        name: 'cars_20', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the cars_20 block.<br>Press any key to continue.</p>'
    };

    var shoes_80 = {
        name: 'shoes_80', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the shoes_80 block.<br>Press any key to continue.</p>'
    };

    var shoes_20 = {
        name: 'shoes_20', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the shoes_20 block.<br>Press any key to continue.</p>'
    };

    var deer_80 = {
        name: 'deer_80', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the deer_80 block.<br>Press any key to continue.</p>'
    };

    var deer_20 = {
        name: 'deer_20', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the deer_20 block.<br>Press any key to continue.</p>'
    };

    var restaurant_80 = {
        name: 'restaurant_80', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the restaurant_80 block.<br>Press any key to continue.</p>'
    };

    var restaurant_20 = {
        name: 'restaurant_20', // Assign a name to the block
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<p style="text-align:left;">This is the restaurant_20 block.<br>Press any key to continue.</p>'
    };

    // Create an array to hold your block objects
    //var blocks = [cars_80, cars_20, shoes_80, shoes_20, deer_80, deer_20, restaurant_80, restaurant_20];

    /*show blocks in random order - no breaks included*/
    //var experimental_timeline = jsPsych.randomization.sampleWithoutReplacement(blocks, blocks.length);

    //block of just 80% congruency versions
    var blocks_80 = [cars_80,shoes_80,deer_80,restaurant_80];

    //block of just 20% congruency versions
    var blocks_20 = [cars_20,shoes_20,deer_20,restaurant_20];

    // Randomly sample 2 blocks with 80% and 2 blocks with 20% congruency
    //var sampled_blocks_80 = jsPsych.randomization.sampleWithoutReplacement(blocks_80, 2);
    //var sampled_blocks_20 = jsPsych.randomization.sampleWithoutReplacement(blocks_20, 2);

    // Combine the sampled blocks into the experimental timeline
    //var experimental_timeline = sampled_blocks_80.concat(sampled_blocks_20);

    //First block (e.g., 80, depending on counterbalancing condition): Just sample two scenarios
    //To remember which ones were sampled, first create an empty array that will later be filled
    var usedCoverstories = []
    var sampled_blocks_80 = jsPsych.randomization.sampleWithoutReplacement(blocks_80, 2);

    console.log('Sampled Blocks:', sampled_blocks_80); // Print the sampled blocks to the console for inspection


    // Iterate through the sampled blocks and add their names to the usedCoverstories array
    for (var i = 0; i < sampled_blocks_80.length; i++) {
            var blockName = sampled_blocks_80[i].name; // Extract the name from the 'type' property
            usedCoverstories.push(blockName); // Add the name to the usedScenarios array
            console.log('Used scenario:', blockName); // Print the block name to the console
        }
    
    console.log('used scenarios:', usedCoverstories);
    
    //save only the names of the cover stories, delete the info about the proportion of conflict trials
    // Remove the last three characters from each string and create a new array
    var usedCoverstories_names = usedCoverstories.map(function (str) {
        return str.slice(0, -3); // Slice removes the last three characters
    });

    console.log(usedCoverstories_names); // The new array with modified strings

    //For the second set of blocks (20% conflict trials), we want to select to scenarios which have not been displayed yet
    //solutin: while loop in which sets of two scenarios are sampled until the cover stories are both not included in usedCoverstories_names
     var sampled_blocks_20; // Initialize the variable to store the sampled blocks

            while (true) {
            // Sample two blocks from the blocks_20 array
            var sample = jsPsych.randomization.sampleWithoutReplacement(blocks_20, 2);

            // Get the names of the sampled blocks
            var sample_names = sample.map(function (block) {
                return block.name; // Assuming each block has a "name" property
            });

            // Remove the last three characters from the block names
            var sample_names_shortened = sample_names.map(function (name) {
                return name.slice(0, -3);
            });

            // Check if any element in sample_names_shortened is in usedCoverstories_names
            var overlap = sample_names_shortened.some(function (name) {
                return usedCoverstories_names.includes(name);
            });

            console.log('Sampled Blocks:', sample_names);
            console.log('Overlap Test Result:', overlap);

            // If there is no overlap, assign sample to sampled_blocks_20 and exit the loop
            if (!overlap) {
                sampled_blocks_20 = sample;
                console.log('Final Selected Blocks:', sampled_blocks_20); // Display the final selected blocks
                break;
            }
            } 
    
    //an idea for easier solution (not working so far): define an array with the names of all cover stories, select those that haven't been  displayed for block 2
    /* var allCoverStories = ["shoes","deer","cars","restaurant"]
    
    console.log('names of stories that have been used:', usedCoverstories_names);

    //extract shortened names of stories that haven't been used
    var unusedCoverstories_names_short = allCoverStories.filter(item => !usedCoverstories_names.includes(item));

    console.log('names of stories that have been NOT been used:', unusedCoverstories_names_short);

    //add proportion info to names of unused cover stories
    var unusedCoverstories_names = unusedCoverstories_names_short.map(item => item + "_20");

    console.log('unused stories with prop info:', unusedCoverstories_names);

    //assign to second block
    var sampled_blocks_20 = unusedCoverstories_names; THIS PART IS THE PROBLEM

    console.log('sampled blocks 20:', sampled_blocks_20);*/

    //another idea: make a for loop: cycle through list of cover stories, add to unused when not part of used
    var sampled_blocks_20 = []

    //for: story in blocks_20
    //if: string(story) is not (partially) in string(sampled_blocks_80)
    //then push to sampled_blocks_20
    
    
    //make timeline
    var experimental_timeline = sampled_blocks_80.concat(sampled_blocks_20);
   

    experimental_procedure = {
     timeline: experimental_timeline
      } 
    timeline.push(experimental_procedure);


    /* start the experiment */
    jsPsych.run(timeline);
    
       
    </script>
